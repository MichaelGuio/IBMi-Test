# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  pull_request:
    branches: [ "main" ]

  # CD: se dispara cuando el PR se mergea (push) a main
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

  # CD: solo se ejecuta tras el merge a main (push), no en pull_request
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Verify IBMi connection secrets
        env:
          IBMI_HOST: ${{ secrets.IBMI_HOST }}
          IBMI_PORT: ${{ secrets.IBMI_PORT }}
        run: |
          if [ -z "$IBMI_HOST" ]; then echo "::error::IBMI_HOST secret vacío o no accesible"; exit 1; fi
          echo "IBMI_HOST length: ${#IBMI_HOST}"
          getent hosts "$IBMI_HOST" || (echo "::error::No se pudo resolver el host $IBMI_HOST" && exit 1)
      # Conexión SSH al IBMi: pull del repo y compilación con makei (TOBi)
      # Credenciales tomadas de GitHub Secrets, nunca hardcodeadas
      - name: SSH pull & compile on IBMi
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IBMI_HOST }}
          username: ${{ secrets.IBMI_USERNAME }}
          password: ${{ secrets.IBMI_PASSWORD }}
          port: ${{ secrets.IBMI_PORT }}
          # Aborta al primer error y muestra el handshake SSH para trazabilidad completa
          script_stop: true
          debug: true
          script: |
            export PATH=/QOpenSys/pkgs/bin:$PATH
            export objlibm=MSSGUIO1
            set -x
            cd /home/MSSGUIO/main
            git pull
            makei build
